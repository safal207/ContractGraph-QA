name: Fetch ccloud 0.8.23

on:
  push:
    paths:
      - '.github/workflows/fetch-ccloud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download ccloud archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/ccloud
          curl -fL --retry 3 \
            'https://binaries.cockroachdb.com/ccloud/ccloud_windows-amd64_0.8.23.zip' \
            -o tools/ccloud/ccloud_windows-amd64_0.8.23.zip
          test -s tools/ccloud/ccloud_windows-amd64_0.8.23.zip
          sha256sum tools/ccloud/ccloud_windows-amd64_0.8.23.zip

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ccloud/ccloud_windows-amd64_0.8.23.zip
          if git diff --cached --quiet; then
            echo 'Archive already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'add ccloud windows amd64 0.8.23'
          git push origin HEAD:${{ github.ref_name }}
