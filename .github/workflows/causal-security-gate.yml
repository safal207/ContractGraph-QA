name: Causal security gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  causal-security-gate:
    name: forbidden reachability regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run causal security change gate
        id: gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p .cgqa
          set +e
          python tools/run_change_gate.py \
            --base-ref "${BASE_SHA}" \
            --config causal-security-gate.toml \
            --repo-root . \
            > .cgqa/causal-security-gate.json
          gate_exit=$?
          set -e
          echo "exit_code=${gate_exit}" >> "${GITHUB_OUTPUT}"
          if [[ "${gate_exit}" != "0" && "${gate_exit}" != "10" ]]; then
            echo "Unexpected gate exit code: ${gate_exit}" >&2
            exit "${gate_exit}"
          fi

      - name: Render causal security job summary
        if: always()
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/render_change_gate_summary.py \
            --input .cgqa/causal-security-gate.json \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload causal security gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: causal-security-gate-${{ github.event.pull_request.number }}
          path: .cgqa/causal-security-gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce causal security gate decision
        if: always()
        shell: bash
        run: |
          exit "${{ steps.gate.outputs.exit_code }}"
