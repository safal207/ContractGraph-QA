name: Causal security gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  causal-security-gate:
    name: trusted forbidden reachability regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trusted base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted

      - name: Check out exact PR head as data only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Verify trusted base and candidate head identity
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted_sha="$(git -C trusted rev-parse HEAD)"
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          if [[ "${trusted_sha}" != "${BASE_SHA}" ]]; then
            echo "Trusted checkout mismatch: expected ${BASE_SHA}, got ${trusted_sha}" >&2
            exit 1
          fi
          if [[ "${candidate_sha}" != "${HEAD_SHA}" ]]; then
            echo "Candidate checkout mismatch: expected ${HEAD_SHA}, got ${candidate_sha}" >&2
            exit 1
          fi
          git -C candidate cat-file -e "${BASE_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run trusted causal security change gate
        id: gate
        working-directory: trusted
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          mkdir -p .cgqa
          set +e
          python tools/run_change_gate.py \
            --base-ref "${BASE_SHA}" \
            --config ../candidate/causal-security-gate.toml \
            --repo-root ../candidate \
            > .cgqa/causal-security-gate.json
          gate_exit=$?
          set -e
          echo "exit_code=${gate_exit}" >> "${GITHUB_OUTPUT}"
          if [[ "${gate_exit}" != "0" && "${gate_exit}" != "10" ]]; then
            echo "Unexpected gate exit code: ${gate_exit}" >&2
            exit "${gate_exit}"
          fi

      - name: Derive source-bound model-result coverage from independent configs
        working-directory: trusted
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          python tools/build_change_gate_measurement_input.py \
            --gate-result .cgqa/causal-security-gate.json \
            --base-config causal-security-gate.toml \
            --head-config ../candidate/causal-security-gate.toml \
            --output .cgqa/measurement-provenance-input.json \
            --source-output .cgqa/measurement-source.json

      - name: Run measurement provenance gate on actual change-gate coverage
        id: provenance
        working-directory: trusted
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          set +e
          python tools/run_measurement_provenance_gate.py \
            --input .cgqa/measurement-provenance-input.json \
            > .cgqa/measurement-provenance.json
          provenance_exit=$?
          set -e
          echo "exit_code=${provenance_exit}" >> "${GITHUB_OUTPUT}"
          if [[ "${provenance_exit}" != "0" && "${provenance_exit}" != "10" ]]; then
            echo "Unexpected provenance exit code: ${provenance_exit}" >&2
            exit "${provenance_exit}"
          fi

      - name: Render causal security job summary from trusted code
        if: always()
        working-directory: trusted
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          python tools/render_change_gate_summary.py \
            --input .cgqa/causal-security-gate.json \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Bind change-gate result into client proof with trusted code
        working-directory: trusted
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          python tools/bind_change_gate_client_proof.py \
            --proof ../candidate/docs/client-proof/proof.json \
            --gate-result .cgqa/causal-security-gate.json \
            --output .cgqa/client-proof.with-change-gate.json

      - name: Re-derive and bind passing measurement provenance into authoritative proof
        working-directory: trusted
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          python tools/bind_measurement_provenance_client_proof.py \
            --proof .cgqa/client-proof.with-change-gate.json \
            --provenance-result .cgqa/measurement-provenance.json \
            --source .cgqa/measurement-source.json \
            --base-config causal-security-gate.toml \
            --head-config ../candidate/causal-security-gate.toml \
            --output .cgqa/client-proof.with-gates.json

      - name: Upload causal security and measurement provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: causal-security-gate-${{ github.event.pull_request.number }}
          path: |
            trusted/.cgqa/causal-security-gate.json
            trusted/.cgqa/measurement-provenance-input.json
            trusted/.cgqa/measurement-source.json
            trusted/.cgqa/measurement-provenance.json
            trusted/.cgqa/client-proof.with-change-gate.json
            trusted/.cgqa/client-proof.with-gates.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce measurement provenance before causal gate decision
        if: always()
        shell: bash
        env:
          GATE_EXIT: ${{ steps.gate.outputs.exit_code }}
          PROVENANCE_EXIT: ${{ steps.provenance.outputs.exit_code }}
        run: |
          if [[ -z "${PROVENANCE_EXIT}" ]]; then
            echo "Measurement provenance did not produce an exit code" >&2
            exit 10
          fi
          if [[ "${PROVENANCE_EXIT}" != "0" ]]; then
            exit "${PROVENANCE_EXIT}"
          fi
          if [[ -z "${GATE_EXIT}" ]]; then
            echo "Causal security gate did not produce an exit code" >&2
            exit 10
          fi
          exit "${GATE_EXIT}"
