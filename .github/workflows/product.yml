name: Product

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  product:
    name: cgqa product E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Check product version contract
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python tools/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_version.py
          fi
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir .product-wheel
      - name: Install built wheel
        run: python -m pip install .product-wheel/contractgraph_qa-*.whl
      - name: Product version outside checkout
        run: cd /tmp && cgqa --version
      - name: Runtime doctor outside checkout
        run: cd /tmp && cgqa doctor --require-forge
      - name: Run self-serve demo outside checkout without Forge usage
        shell: bash
        run: |
          rm -rf /tmp/cgqa-self-demo
          cd /tmp
          cgqa demo --output-dir /tmp/cgqa-self-demo
          cgqa verify-bundle /tmp/cgqa-self-demo/CGQA-005.evidence.zip
          test -f /tmp/cgqa-self-demo/CGQA-005.finding.json
          test -f /tmp/cgqa-self-demo/CGQA-005.md
      - name: Create fail-closed client scaffold outside checkout
        shell: bash
        run: |
          rm -rf /tmp/cgqa-scaffold-project
          mkdir -p /tmp/cgqa-scaffold-project
          cd /tmp/cgqa-scaffold-project
          cgqa init-engagement acme-escrow
          test -f engagements/acme-escrow/manifest.json
          test -f engagements/acme-escrow/cgqa.toml
          test -f engagements/acme-escrow/capture/ClientEngagementCapture.t.sol.example
          test ! -f engagements/acme-escrow/capture/ClientEngagementCapture.t.sol
          grep -q "CGQA scaffold not configured" engagements/acme-escrow/capture/ClientEngagementCapture.t.sol.example
          cgqa validate --manifest engagements/acme-escrow/manifest.json
          if cgqa init-engagement acme-escrow; then
            echo "second init unexpectedly overwrote an existing scaffold" >&2
            exit 1
          fi
      - name: Validate reviewed manifest and result contract
        run: >-
          cgqa validate
          --manifest manifests/examples/adapter-fixture.json
          --result results/examples/CGQA-005.result.json
      - name: Unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Run full local product pipeline
        run: cgqa run --config cgqa.example.toml --clean
      - name: Verify generated finding
        run: cmp dist/CGQA-005/CGQA-005.finding.json reports/examples/CGQA-005.finding.json
      - name: Verify generated report
        run: cmp dist/CGQA-005/CGQA-005.md reports/examples/CGQA-005.md
      - name: Verify evidence bundle outside checkout
        run: cd /tmp && cgqa verify-bundle "$GITHUB_WORKSPACE/dist/CGQA-005/CGQA-005.evidence.zip"
      - name: Run one-command multi-invariant engagement outside checkout
        run: cd /tmp && cgqa engagement-run --config "$GITHUB_WORKSPACE/cgqa.engagement.example.toml"
      - name: Verify direct engagement capture byte-for-byte
        run: cmp results/generated/CGQA-E-001.engagement-result.json results/examples/CGQA-E-001.engagement-result.json
      - name: Preserve first one-command bundle
        run: cp dist/CGQA-E-001-run/CGQA-E-001.engagement.zip /tmp/CGQA-E-001.first.zip
      - name: Verify engagement outcome semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dist/CGQA-E-001-run/engagement.json').read_text(encoding='utf-8'))
          assert data['coverage'] == {
              'declaredInvariants': 3,
              'checkedInvariants': 3,
              'violated': 1,
              'notFoundWithinBound': 1,
              'inconclusive': 1,
          }
          assert Path('dist/CGQA-E-001-run/findings/CGQA-E-001-F01.finding.json').is_file()
          PY
      - name: Re-run one-command engagement outside checkout for deterministic byte check
        run: cd /tmp && cgqa engagement-run --config "$GITHUB_WORKSPACE/cgqa.engagement.example.toml"
      - name: Verify deterministic one-command engagement bundle bytes
        run: cmp /tmp/CGQA-E-001.first.zip dist/CGQA-E-001-run/CGQA-E-001.engagement.zip
      - name: Verify engagement bundle outside checkout
        run: cd /tmp && cgqa verify-engagement-bundle "$GITHUB_WORKSPACE/dist/CGQA-E-001-run/CGQA-E-001.engagement.zip"
      - name: Assemble and verify release-candidate distribution
        shell: bash
        run: |
          rm -rf .distribution-smoke
          mkdir .distribution-smoke
          cp .product-wheel/contractgraph_qa-*.whl .distribution-smoke/
          cp /tmp/cgqa-self-demo/CGQA-005.md .distribution-smoke/DEMO_REPORT.md
          cp /tmp/cgqa-self-demo/CGQA-005.evidence.zip .distribution-smoke/DEMO_EVIDENCE.zip
          cp docs/client-proof/README.md .distribution-smoke/CLIENT_PROOF.md
          cp docs/GITHUB_RELEASE.md .distribution-smoke/VERIFY.md
          WHEEL_PATH="$(find .distribution-smoke -maxdepth 1 -type f -name 'contractgraph_qa-*.whl' -print -quit)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          python tools/build_release_sbom.py \
            --wheel "${WHEEL_PATH}" \
            --output .distribution-smoke/SBOM.cdx.json \
            --source-commit "${GITHUB_SHA}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python tools/verify_release_sbom.py \
            --wheel "${WHEEL_PATH}" \
            --sbom .distribution-smoke/SBOM.cdx.json \
            --source-commit "${GITHUB_SHA}"
          (cd .distribution-smoke && sha256sum contractgraph_qa-*.whl DEMO_REPORT.md DEMO_EVIDENCE.zip CLIENT_PROOF.md SBOM.cdx.json VERIFY.md > SHA256SUMS)
          (cd .distribution-smoke && sha256sum -c SHA256SUMS)
