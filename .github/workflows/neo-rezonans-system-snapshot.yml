name: NEO REZONANS System Snapshot Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - governance/neo-rezonans-system-snapshot.v0.1.json
      - benchmarks/fcrp-v0.2/FCRP-SYSTEM-001-neo-rezonans.json
      - contractgraph_qa/system_snapshot.py
      - tools/tests/test_system_snapshot.py
      - docs/NEO_REZONANS_SYSTEM_CONTRACT_V0_1.md
      - .github/workflows/neo-rezonans-system-snapshot.yml

permissions:
  contents: read

concurrency:
  group: neo-rezonans-system-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SNAPSHOT: governance/neo-rezonans-system-snapshot.v0.1.json
      FCRP_CASE: benchmarks/fcrp-v0.2/FCRP-SYSTEM-001-neo-rezonans.json
    steps:
      - name: Checkout exact system-contract head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify exact head and self-host base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          HOST_BASE="$(python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('governance/neo-rezonans-system-snapshot.v0.1.json').read_text())
          print(value['snapshotPolicy']['hostBaseCommit'])
          PY
          )"
          test "$PR_BASE_SHA" = "$HOST_BASE"
          git merge-base --is-ancestor "$HOST_BASE" "$EXACT_HEAD"
          echo "HOST_BASE_PASS $HOST_BASE"

      - name: Compile system and FCRP validators
        run: |
          python -m py_compile \
            contractgraph_qa/fcrp.py \
            contractgraph_qa/fcrp_v02.py \
            contractgraph_qa/system_snapshot.py \
            tools/tests/test_system_snapshot.py

      - name: Run dependency-free system contract tests
        run: python -m unittest discover -s tools/tests -p 'test_system_snapshot.py' -v

      - name: Validate system snapshot and FCRP-SYSTEM-001
        run: |
          mkdir -p reports/system
          python - <<'PY'
          import json
          from pathlib import Path
          from contractgraph_qa.fcrp_v02 import evaluate_fcrp_v02_case
          from contractgraph_qa.system_snapshot import validate_system_snapshot

          snapshot_path = Path('governance/neo-rezonans-system-snapshot.v0.1.json')
          case_path = Path('benchmarks/fcrp-v0.2/FCRP-SYSTEM-001-neo-rezonans.json')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
          case = json.loads(case_path.read_text(encoding='utf-8'))
          system_result = validate_system_snapshot(snapshot)
          fcrp_result = evaluate_fcrp_v02_case(case)
          assert system_result['decision'] == 'PASS'
          assert system_result['authorityTransferEdges'] == 1
          assert system_result['feedbackEdges'] == 1
          assert fcrp_result['decision'] == 'PASS'
          assert fcrp_result['mutationAuthorized'] is False
          assert fcrp_result['causalPropagationStopped'] is True
          output = {
              'systemSnapshot': system_result,
              'fcrpSystemCase': fcrp_result,
          }
          Path('reports/system/system-result.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(output, sort_keys=True))
          PY

      - name: Verify pinned external main heads
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          snapshot = json.loads(Path('governance/neo-rezonans-system-snapshot.v0.1.json').read_text())
          host = snapshot['snapshotPolicy']['hostRepository']
          repository_commits = {}
          for layer in snapshot['layers']:
              repository = layer['repository']
              commit = layer['canonicalCommit']
              previous = repository_commits.setdefault(repository, commit)
              if previous != commit:
                  raise SystemExit(
                      f'one snapshot cannot bind {repository} to both {previous} and {commit}'
                  )

          observed = {}
          for repository, expected in sorted(repository_commits.items()):
              if repository == host:
                  observed[repository] = {
                      'mode': 'self-host-base',
                      'expected': expected,
                      'observed': snapshot['snapshotPolicy']['hostBaseCommit'],
                      'match': expected == snapshot['snapshotPolicy']['hostBaseCommit'],
                  }
                  if not observed[repository]['match']:
                      raise SystemExit(f'host base mismatch for {repository}')
                  continue
              remote = f'https://github.com/{repository}.git'
              output = subprocess.check_output(
                  ['git', 'ls-remote', remote, 'refs/heads/main'],
                  text=True,
                  timeout=30,
              ).strip()
              if not output:
                  raise SystemExit(f'cannot resolve main for {repository}')
              actual = output.split()[0]
              observed[repository] = {
                  'mode': 'live-main',
                  'expected': expected,
                  'observed': actual,
                  'match': actual == expected,
              }
              if actual != expected:
                  raise SystemExit(
                      f'{repository} main drifted: expected {expected}, observed {actual}'
                  )

          Path('reports/system/repository-heads.json').write_text(
              json.dumps(observed, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'EXTERNAL_MAIN_HEADS_PASS {len(observed) - 1}')
          PY

      - name: Build evidence digests
        run: |
          sha256sum \
            "$SNAPSHOT" \
            "$FCRP_CASE" \
            reports/system/system-result.json \
            reports/system/repository-heads.json \
            > reports/system/SHA256SUMS.txt

      - name: Upload system snapshot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo-rezonans-system-${{ env.EXACT_HEAD }}
          path: reports/system/
          if-no-files-found: error
          retention-days: 30
