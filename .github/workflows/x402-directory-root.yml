name: x402 frozen production directory root

on:
  pull_request:
    paths:
      - "benchmarks/x402-3758-directory-root/**"
      - ".github/workflows/x402-directory-root.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/x402-3758-directory-root/**"
      - ".github/workflows/x402-directory-root.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline frozen commitment and mutation controls
        run: node --test benchmarks/x402-3758-directory-root/directory-root.test.mjs
      - name: Independent guarded Python oracle
        run: python benchmarks/x402-3758-directory-root/oracle.py
