name: Gonka correlation storage guard

on:
  pull_request:
    paths:
      - 'external-validation/gonka/correlation-collision.schema.json'
      - 'external-validation/gonka/harness/cgqa_correlation_collision_test.go'
      - '.github/workflows/gonka-correlation-storage-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-guard:
    name: Gonka repeated client ID storage collision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GONKA_SHA: f040d0a5b5ef207a0c431894c9f9e2608f9d3073
      CGQA_EVIDENCE_DIR: ${{ github.workspace }}/cgqa-correlation-collision
    steps:
      - name: Checkout ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout pinned Gonka revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gonka-ai/gonka
          ref: ${{ env.GONKA_SHA }}
          path: upstream-gonka
          persist-credentials: false

      - name: Setup upstream Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: upstream-gonka/devshard/go.mod
          cache: false

      - name: Install storage collision control
        shell: bash
        run: |
          set -euo pipefail
          cp external-validation/gonka/harness/cgqa_correlation_collision_test.go upstream-gonka/devshard/cmd/devshardctl/cgqa_correlation_collision_test.go
          gofmt -w upstream-gonka/devshard/cmd/devshardctl/cgqa_correlation_collision_test.go
          mkdir -p "$CGQA_EVIDENCE_DIR"

      - name: Execute repeated client ID storage control
        working-directory: upstream-gonka/devshard
        env:
          CGQA_UPSTREAM_REVISION: ${{ env.GONKA_SHA }}
        run: >-
          go test ./cmd/devshardctl
          -run '^TestCGQAGonkaClientCorrelationCanonicalizationCollision$'
          -v -count=1

      - name: Validate collision evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(os.environ['CGQA_EVIDENCE_DIR'])
          evidence = root / 'reconciliation.json'
          if not evidence.is_file() or evidence.stat().st_size == 0:
              raise SystemExit('collision reconciliation evidence missing')
          schema = json.loads(Path('external-validation/gonka/correlation-collision.schema.json').read_text(encoding='utf-8'))
          instance = json.loads(evidence.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(instance), key=lambda e: list(e.path))
          if errors:
              raise SystemExit('\n'.join(f'{e.json_path}: {e.message}' for e in errors))
          if instance.get('candidate_status') != 'REJECTED_AS_PRODUCTION_FIX':
              raise SystemExit('direct client-ID canonicalization was not rejected; remediation model must be re-evaluated')
          print(json.dumps(instance, indent=2))
          PY

      - name: Publish collision guard summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          p = Path(os.environ['CGQA_EVIDENCE_DIR']) / 'reconciliation.json'
          print('### Gonka client correlation storage guard')
          if not p.is_file():
              print('- evidence missing')
          else:
              d = json.loads(p.read_text(encoding='utf-8'))
              print(f"- logical operations simulated: `{d.get('logical_operations_simulated')}`")
              print(f"- canonical request rows: `{d.get('canonical_request_rows')}`")
              print(f"- attempt nonces retained together: `{d.get('attempt_nonces')}`")
              print(f"- records coalesced: `{d.get('records_coalesced')}`")
              print(f"- direct client-ID canonicalization: `{d.get('candidate_status')}`")
          PY

      - name: Upload collision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gonka-client-correlation-collision
          path: cgqa-correlation-collision
          if-no-files-found: error
          retention-days: 14
