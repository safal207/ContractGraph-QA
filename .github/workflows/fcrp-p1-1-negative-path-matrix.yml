name: FCRP P1-1 — Negative-Path Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - tools/negative_path_matrix.py
      - tools/tests/test_negative_path_matrix.py
      - docs/NEO_REZONANS_P1_1_NEGATIVE_PATH_MATRIX_V0_1.md
      - .github/workflows/fcrp-p1-1-negative-path-matrix.yml

permissions:
  contents: read

concurrency:
  group: fcrp-p1-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      EXPECTED_PR_BASE: b54173530c675083426137176cde0aed0b90853a
      PROOFPATH_HEAD: 4a05ee31d7497979c2505dd55bfef08823302e24

    steps:
      - name: Checkout exact P1-1 subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify exact subject and PR base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PR_BASE" "$EXACT_HEAD"
          if [ -n "$PR_BASE_SHA" ]; then test "$PR_BASE_SHA" = "$EXPECTED_PR_BASE"; fi

      - name: Run focused P1-1 unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m py_compile \
            tools/negative_path_matrix.py \
            tools/tests/test_negative_path_matrix.py
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest \
            tools.tests.test_negative_path_matrix -v

      - name: Run and independently replay the negative-path matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/p1-1
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/negative_path_matrix.py run \
            --output-dir evidence/p1-1 \
            --checked-subject "$EXACT_HEAD" \
            --proofpath-head "$PROOFPATH_HEAD"
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/negative_path_matrix.py verify \
            --inputs evidence/p1-1/matrix-inputs.json \
            --result evidence/p1-1/matrix-result.json \
            --checked-subject "$EXACT_HEAD" \
            --proofpath-head "$PROOFPATH_HEAD"
          jq -e '
            .decision == "PASS" and
            .coverage.total_cases >= 10 and
            .coverage.matched_decisions == .coverage.total_cases and
            .coverage.executed_cases == 0 and
            .coverage.replay_stable_cases == .coverage.total_cases and
            (.authority.execution_authorized == false) and
            (.authority.mutation_authorized == false) and
            (.authority.external_effects_authorized == false)
          ' evidence/p1-1/matrix-result.json >/dev/null

      - name: Capture exact run context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("evidence/p1-1/run-context.json").write_text(json.dumps({
              "schema": "cgqa.p1-1-run-context.v0.1",
              "checked_subject": os.environ["EXACT_HEAD"],
              "expected_subject": os.environ["EXACT_HEAD"],
              "proofpath_head": os.environ["PROOFPATH_HEAD"],
              "reported_sha": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "authority": "advisory only; dry-run policy evaluation; no executor or external effect",
          }, indent=2, sort_keys=True) + "\n")
          PY

      - name: Build immutable P1-1 evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd evidence/p1-1
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c <(sed 's#^  *./#  #' SHA256SUMS)

      - name: Upload P1-1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fcrp-p1-1-negative-path-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/p1-1/
          if-no-files-found: error
          retention-days: 90
