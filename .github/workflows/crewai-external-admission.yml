name: CrewAI external proof admission

on:
  pull_request:
    paths:
      - "proofs/crewai-retry-external-admission-v0.1/**"
      - ".github/workflows/crewai-external-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned external evidence
        run: |
          python proofs/crewai-retry-external-admission-v0.1/verify_admission.py \
            --write-report /tmp/crewai-admission-report.json
          diff -u \
            proofs/crewai-retry-external-admission-v0.1/report.json \
            /tmp/crewai-admission-report.json
