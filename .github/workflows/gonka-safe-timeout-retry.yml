name: Gonka safe timeout retry reconciliation

on:
  pull_request:
    paths:
      - 'external-validation/gonka/harness/cgqa_safe_timeout_retry_evidence_test.go'
      - 'external-validation/gonka/harness/cgqa_safe_correlation_evidence_test.go'
      - 'external-validation/gonka/remediation/cgqa_safe_correlation_support.go'
      - 'external-validation/gonka/remediation/apply_cgqa_safe_correlation_patch.py'
      - '.github/workflows/gonka-safe-timeout-retry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-timeout-retry:
    name: Gonka G-002A/B safe correlation reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GONKA_SHA: f040d0a5b5ef207a0c431894c9f9e2608f9d3073
      CGQA_EVIDENCE_DIR: ${{ github.workspace }}/cgqa-safe-timeout-retry
    steps:
      - name: Checkout ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout pinned Gonka revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gonka-ai/gonka
          ref: ${{ env.GONKA_SHA }}
          path: upstream-gonka
          persist-credentials: false

      - name: Setup upstream Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: upstream-gonka/devshard/go.mod
          cache: false

      - name: Install safe-correlation proof support and harnesses
        shell: bash
        run: |
          set -euo pipefail
          cp external-validation/gonka/remediation/cgqa_safe_correlation_support.go upstream-gonka/devshard/cmd/devshardctl/cgqa_safe_correlation_support.go
          cp external-validation/gonka/harness/cgqa_gonka_test.go upstream-gonka/devshard/testenv/citest/cgqa_gonka_test.go
          cp external-validation/gonka/harness/cgqa_identity_boundary_test.go upstream-gonka/devshard/testenv/citest/cgqa_identity_boundary_test.go
          cp external-validation/gonka/harness/cgqa_identity_evidence_test.go upstream-gonka/devshard/testenv/citest/cgqa_identity_evidence_test.go
          cp external-validation/gonka/harness/cgqa_timeout_identity_evidence_test.go upstream-gonka/devshard/testenv/citest/cgqa_timeout_identity_evidence_test.go
          cp external-validation/gonka/harness/cgqa_safe_correlation_evidence_test.go upstream-gonka/devshard/testenv/citest/cgqa_safe_correlation_evidence_test.go
          cp external-validation/gonka/harness/cgqa_safe_timeout_retry_evidence_test.go upstream-gonka/devshard/testenv/citest/cgqa_safe_timeout_retry_evidence_test.go
          mkdir -p "$CGQA_EVIDENCE_DIR"

      - name: Apply non-collapsing correlation proof patch
        shell: bash
        run: |
          set -euo pipefail
          python external-validation/gonka/remediation/apply_cgqa_safe_correlation_patch.py upstream-gonka
          gofmt -w \
            upstream-gonka/devshard/cmd/devshardctl/cgqa_safe_correlation_support.go \
            upstream-gonka/devshard/cmd/devshardctl/perfstore.go \
            upstream-gonka/devshard/cmd/devshardctl/gateway.go \
            upstream-gonka/devshard/cmd/devshardctl/proxy.go \
            upstream-gonka/devshard/cmd/devshardctl/redundancy.go \
            upstream-gonka/devshard/testenv/citest/cgqa_*_test.go
          test "$(grep -F -c 'RunInference(propagateCGQARequestContext(context.Background(), r.Context()), params' upstream-gonka/devshard/cmd/devshardctl/proxy.go)" -eq 2
          grep -F 'PRIMARY KEY (client_correlation_id, internal_request_id, escrow_id)' upstream-gonka/devshard/cmd/devshardctl/cgqa_safe_correlation_support.go

      - name: Compile unchanged criterion against patched Gonka
        working-directory: upstream-gonka/devshard
        run: TESTENV_CITEST=0 go test -tags=testenvci ./testenv/citest -run '^$' -count=1

      - name: Build patched devshardctl image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file upstream-gonka/devshard/Dockerfile \
            --target devshardctl-runtime \
            --build-arg DEVSHARD_VERSION=cgqa-safe-timeout-retry \
            --tag devshard-runtime:latest \
            upstream-gonka
          docker image inspect devshard-runtime:latest --format '{{.Id}}' > "$CGQA_EVIDENCE_DIR/devshardctl.image-id.txt"

      - name: Build Gonka devshardd
        working-directory: upstream-gonka/devshard/testenv
        run: make build-devshardd

      - name: Re-prove safe correlation prerequisite
        working-directory: upstream-gonka/devshard
        env:
          TESTENV_CITEST: '1'
          CGQA_EVIDENCE_DIR: ${{ github.workspace }}/cgqa-safe-prerequisite
        run: >-
          go test -tags=testenvci ./testenv/citest
          -run '^TestCGQAGonkaSafeCorrelationEvidence$'
          -v -count=1 -timeout=30m

      - name: Require safe correlation prerequisite PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('cgqa-safe-prerequisite/G-CORR-SAFE/reconciliation.json')
          if not p.is_file():
              raise SystemExit('safe correlation prerequisite evidence missing')
          d = json.loads(p.read_text())
          print(json.dumps(d, indent=2))
          if d.get('verdict') != 'PASS':
              raise SystemExit('safe correlation prerequisite did not PASS')
          PY

      - name: Execute G-002A/B safe timeout retry reconciliation
        working-directory: upstream-gonka/devshard
        env:
          TESTENV_CITEST: '1'
          CGQA_EVIDENCE_DIR: ${{ github.workspace }}/cgqa-safe-timeout-retry
        run: >-
          go test -tags=testenvci ./testenv/citest
          -run '^TestCGQAGonkaSafeTimeoutRetryEvidence$'
          -v -count=1 -timeout=30m

      - name: Validate and enforce reconciliation verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('cgqa-safe-timeout-retry/reconciliation.json')
          if not p.is_file():
              raise SystemExit('G-002A/B reconciliation evidence missing')
          d = json.loads(p.read_text())
          print(json.dumps(d, indent=2))
          if d.get('schema_version') != 'gonka-safe-timeout-retry-v0.1':
              raise SystemExit('unexpected reconciliation schema version')
          cases = {c.get('case_id'): c for c in d.get('cases', [])}
          if set(cases) != {'G-002A', 'G-002B'}:
              raise SystemExit(f'unexpected cases: {sorted(cases)}')
          for case_id, c in sorted(cases.items()):
              if c.get('verdict') != 'PASS':
                  raise SystemExit(f'{case_id} verdict={c.get("verdict")} unexplained={c.get("unexplained_effects")}')
              if not c.get('timeout_observed') or not c.get('first_completion_observed'):
                  raise SystemExit(f'{case_id}: ambiguity precondition not proven')
              if not c.get('canonical_ids_distinct') or not c.get('all_accounting_resolved'):
                  raise SystemExit(f'{case_id}: canonical accounting reconciliation failed')
          if d.get('verdict') != 'PASS':
              raise SystemExit('bundle verdict is not PASS')
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('cgqa-safe-timeout-retry/reconciliation.json')
          print('### Gonka safe timeout/retry reconciliation')
          if not p.is_file():
              print('- evidence missing')
          else:
              d = json.loads(p.read_text())
              print(f"- bundle verdict: `{d.get('verdict')}`")
              for c in d.get('cases', []):
                  print(f"- {c.get('case_id')}: `{c.get('verdict')}`; correlations={c.get('client_correlation_ids')}; internal_ids={c.get('internal_request_ids')}; winner_nonces={c.get('winner_nonces')}; unexplained={c.get('unexplained_effects')}")
          PY

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gonka-safe-timeout-retry-evidence
          path: |
            cgqa-safe-prerequisite
            cgqa-safe-timeout-retry
          if-no-files-found: error
          retention-days: 14
