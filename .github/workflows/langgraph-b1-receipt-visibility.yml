name: LangGraph b1 receipt visibility

on:
  pull_request:
    paths:
      - "proofs/langgraph-b1-receipt-visibility-v0.2/**"
      - ".github/workflows/langgraph-b1-receipt-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned LangGraph runtime
        run: |
          python -m pip install \
            "langgraph==1.2.11" \
            "langgraph-checkpoint==4.2.0" \
            "langgraph-checkpoint-sqlite==3.1.1"
      - name: Run receipt visibility experiment
        run: |
          python proofs/langgraph-b1-receipt-visibility-v0.2/run_visibility.py \
            --write-report /tmp/langgraph-b1-receipt-visibility.json
          cat /tmp/langgraph-b1-receipt-visibility.json
      - name: Compare frozen report when present
        run: |
          if [ -f proofs/langgraph-b1-receipt-visibility-v0.2/report.json ]; then
            diff -u \
              proofs/langgraph-b1-receipt-visibility-v0.2/report.json \
              /tmp/langgraph-b1-receipt-visibility.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: langgraph-b1-receipt-visibility-report
          path: /tmp/langgraph-b1-receipt-visibility.json
