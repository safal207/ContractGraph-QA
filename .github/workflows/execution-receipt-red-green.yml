name: Execution Receipt RED-to-GREEN

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - proof/aegisora-execution-evidence-001
    paths:
      - "proofs/execution-receipt-boundary-v0.1/**"
      - "tests/external/aegisora_execution_receipt_red_green_001.ts"
      - "scripts/verify_aegisora_execution_receipt_red_green_001.py"
      - "docs/external/EXECUTION_RECEIPT_001.md"
      - ".github/workflows/execution-receipt-red-green.yml"

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  AEGISORA_COMMIT: 2bac618215671f6f0ac8ebddf169830d4fc0f9b3

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run framework-neutral execution receipt contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 proofs/execution-receipt-boundary-v0.1/harness.py \
            --write-report artifacts/execution-receipt-framework-contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/execution-receipt-framework-contract.json")
          r = json.loads(p.read_text())
          assert r["status"] == "PASS"
          assert r["system_case"] == "EXECUTION-RECEIPT-001"
          assert r["cases"]["provider-throws"]["external_effect_status"] == "UNKNOWN"
          assert r["cases"]["lost-terminal"]["continuity"] == "REVALIDATE"
          assert all(item["detected"] for item in r["mutants"])
          print(json.dumps({
              "framework_contract": "PASS",
              "mutants_detected": len(r["mutants"]),
              "receipt_count": r["receipt_count"],
          }, sort_keys=True))
          PY

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Checkout pinned Aegisora subject
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/aegisora-ai/aegisora.git subject
          git -C subject checkout --quiet --detach "$AEGISORA_COMMIT"
          test "$(git -C subject rev-parse HEAD)" = "$AEGISORA_COMMIT"

      - name: Capture pinned subject source digests
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'repository=aegisora-ai/aegisora\n'
            printf 'commit=%s\n' "$AEGISORA_COMMIT"
            for path in \
              core/packages/runtime/src/enforcement/enforcement-gate.ts \
              core/packages/runtime/src/enforcement/enterprise-audit-bridge.ts \
              core/packages/runtime/src/enforcement/enterprise-usage-bridge.ts \
              core/packages/runtime/src/providers/provider-execution-gateway.ts \
              core/packages/runtime/src/providers/base-provider.ts
            do
              digest="$(git -C subject show "$AEGISORA_COMMIT:$path" | sha256sum | awk '{print $1}')"
              printf '%s  %s\n' "$digest" "$path"
            done
          } | tee artifacts/aegisora-execution-receipt-subject-digests.txt

      - name: Install pinned Aegisora runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd subject
          cp pnpm-lock.yaml "$GITHUB_WORKSPACE/artifacts/aegisora-pnpm-lock-before.yaml"
          pnpm install --no-frozen-lockfile --filter '@aegisora/runtime...'
          cp pnpm-lock.yaml "$GITHUB_WORKSPACE/artifacts/aegisora-pnpm-lock-resolved.yaml"
          git diff -- pnpm-lock.yaml | tee "$GITHUB_WORKSPACE/artifacts/aegisora-pnpm-lock-diff.patch"
          pnpm --filter '@aegisora/runtime...' build

      - name: Inject external RED-to-GREEN probe
        shell: bash
        run: |
          set -euo pipefail
          cp \
            tests/external/aegisora_execution_receipt_red_green_001.ts \
            subject/core/packages/runtime/test/external-execution-receipt-red-green-001.ts

      - name: Execute native RED and adapter GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd subject
          EVIDENCE_OUT="$GITHUB_WORKSPACE/artifacts/aegisora-execution-receipt-red-green-subject.json" \
            pnpm --filter @aegisora/runtime exec tsx \
            test/external-execution-receipt-red-green-001.ts \
            | tee "$GITHUB_WORKSPACE/artifacts/aegisora-execution-receipt-red-green-console.txt"

      - name: Independently verify RED-to-GREEN evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_aegisora_execution_receipt_red_green_001.py \
            --report artifacts/aegisora-execution-receipt-red-green-subject.json \
            --output artifacts/aegisora-execution-receipt-red-green-verification.json

          sha256sum \
            artifacts/execution-receipt-framework-contract.json \
            artifacts/aegisora-execution-receipt-red-green-subject.json \
            artifacts/aegisora-execution-receipt-red-green-verification.json \
            artifacts/aegisora-execution-receipt-subject-digests.txt \
            artifacts/aegisora-pnpm-lock-before.yaml \
            artifacts/aegisora-pnpm-lock-resolved.yaml \
            artifacts/aegisora-pnpm-lock-diff.patch \
            | tee artifacts/execution-receipt-red-green-sha256.txt

      - name: Upload EXECUTION-RECEIPT-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-receipt-001
          path: |
            artifacts/execution-receipt-framework-contract.json
            artifacts/aegisora-execution-receipt-red-green-subject.json
            artifacts/aegisora-execution-receipt-red-green-verification.json
            artifacts/aegisora-execution-receipt-red-green-console.txt
            artifacts/aegisora-execution-receipt-subject-digests.txt
            artifacts/aegisora-pnpm-lock-before.yaml
            artifacts/aegisora-pnpm-lock-resolved.yaml
            artifacts/aegisora-pnpm-lock-diff.patch
            artifacts/execution-receipt-red-green-sha256.txt
          if-no-files-found: warn
          retention-days: 30
