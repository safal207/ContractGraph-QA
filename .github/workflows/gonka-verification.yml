name: Gonka verification contract

on:
  pull_request:
    paths:
      - 'external-validation/gonka/**'
      - '.github/workflows/gonka-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-guard:
    name: Gonka upstream contract guard
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GONKA_SHA: f040d0a5b5ef207a0c431894c9f9e2608f9d3073
    steps:
      - name: Checkout ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate CGQA profile artifacts
        shell: bash
        run: |
          python -m json.tool external-validation/gonka/evidence.schema.json >/dev/null
          ruby -e 'require "yaml"; %w[external-validation/gonka/graph.yaml external-validation/gonka/cases/G-001-normal-inference.yaml external-validation/gonka/cases/G-002-timeout-retry.yaml].each { |f| YAML.load_file(f) }'

      - name: Checkout pinned Gonka revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gonka-ai/gonka
          ref: ${{ env.GONKA_SHA }}
          path: upstream-gonka
          persist-credentials: false

      - name: Verify upstream causal/accounting primitives
        shell: bash
        run: |
          grep -F 'mux.HandleFunc("GET /v1/requests/{request_id}"' upstream-gonka/devshard/cmd/devshardctl/gateway.go
          grep -F 'const RequestIDHeader = "X-Request-Id"' upstream-gonka/devshard/observability/ctx.go
          grep -F 'request_accounting_attempts' upstream-gonka/devshard/cmd/devshardctl/request_accounting.go
          grep -F 'TestHandleRequestAccountingReturnsJoinedInferenceCosts' upstream-gonka/devshard/cmd/devshardctl/request_accounting_test.go
          grep -F 'TestHandleRequestAccountingResolvesCachedRequestAliasCosts' upstream-gonka/devshard/cmd/devshardctl/request_accounting_test.go
          test -f upstream-gonka/devshard/testenv/README.md
          grep -F 'TestGatewayChat' upstream-gonka/devshard/testenv/README.md
          grep -F 'e.POST("/testenv/fault", s.handleFaultPatch)' upstream-gonka/devshard/testenv/mockopenai/server.go
          grep -F 'LatencyMs' upstream-gonka/devshard/testenv/mockopenai/config.go

      - name: Setup upstream Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: upstream-gonka/devshard/go.mod
          cache: false

      - name: Compile CGQA evidence harness against pinned Gonka
        shell: bash
        run: |
          cp external-validation/gonka/harness/cgqa_gonka_test.go upstream-gonka/devshard/testenv/citest/cgqa_gonka_test.go
          gofmt -w upstream-gonka/devshard/testenv/citest/cgqa_gonka_test.go
          cd upstream-gonka/devshard
          TESTENV_CITEST=0 go test -tags=testenvci ./testenv/citest -run '^$' -count=1

      - name: Run pinned upstream request-accounting controls
        working-directory: upstream-gonka/devshard
        run: >-
          go test ./cmd/devshardctl
          -run '^TestHandleRequestAccounting(ReturnsJoinedInferenceCosts|ResolvesCachedRequestAliasCosts)$'
          -count=1

      - name: Contract summary
        shell: bash
        run: |
          {
            echo '### Gonka verification contract guard'
            echo
            echo "Pinned upstream: \`$GONKA_SHA\`"
            echo '- CGQA YAML/JSON artifacts parse successfully.'
            echo '- X-Request-Id correlation primitive is present upstream.'
            echo '- /v1/requests/{request_id} accounting surface is present upstream.'
            echo '- Mock OpenAI deterministic latency fault hook is present upstream.'
            echo '- CGQA G-001/G-002 harness compiles against the pinned Gonka testenv.'
            echo '- Upstream joined-cost and cached-alias accounting controls pass.'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-evidence:
    name: Gonka G-001 G-002 Docker evidence
    needs: contract-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GONKA_SHA: f040d0a5b5ef207a0c431894c9f9e2608f9d3073
      CGQA_EVIDENCE_DIR: ${{ github.workspace }}/cgqa-evidence
    steps:
      - name: Checkout ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout pinned Gonka revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: gonka-ai/gonka
          ref: ${{ env.GONKA_SHA }}
          path: upstream-gonka
          persist-credentials: false

      - name: Setup upstream Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: upstream-gonka/devshard/go.mod
          cache: false

      - name: Install CGQA harness into upstream testenv
        shell: bash
        run: |
          cp external-validation/gonka/harness/cgqa_gonka_test.go upstream-gonka/devshard/testenv/citest/cgqa_gonka_test.go
          gofmt -w upstream-gonka/devshard/testenv/citest/cgqa_gonka_test.go
          mkdir -p "$CGQA_EVIDENCE_DIR"

      - name: Build Gonka devshardd for local Docker testenv
        working-directory: upstream-gonka/devshard/testenv
        run: make build-devshardd

      - name: Execute G-001 and G-002 evidence run
        working-directory: upstream-gonka/devshard
        env:
          TESTENV_CITEST: '1'
        run: >-
          go test -tags=testenvci ./testenv/citest
          -run '^TestCGQAGonkaG001G002$'
          -v -count=1 -timeout=30m

      - name: Parse produced evidence
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=("$CGQA_EVIDENCE_DIR"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No CGQA evidence JSON produced.'
            exit 0
          fi
          for f in "${files[@]}"; do
            python -m json.tool "$f" >/dev/null
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            python - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          p = sys.argv[1]
          with open(p, encoding='utf-8') as fh:
              d = json.load(fh)
          print(f"- verdict: `{d.get('verdict')}`")
          print(f"- transport request ids: `{len(d.get('transport_request_ids', []))}`")
          print(f"- execution nonces: `{d.get('observed_execution_nonces', [])}`")
          print(f"- all-attempt cost: `{d.get('cost', {}).get('all_attempts_actual_cost')}`")
          print(f"- unexplained effects: `{len(d.get('unexplained_effects', []))}`")
          PY
          done

      - name: Upload CGQA Gonka evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gonka-cgqa-evidence
          path: cgqa-evidence
          if-no-files-found: warn
          retention-days: 14
