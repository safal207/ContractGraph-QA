name: Quickstart hardening

on:
  pull_request:
    paths:
      - "contractgraph_qa/project_quickstart*.py"
      - "contractgraph_qa/*_cli.py"
      - "tools/tests/test_project_quickstart*.py"
      - "docs/QUICKSTART_HARDENING.md"
      - ".github/workflows/quickstart-hardening.yml"
  push:
    branches: [main]
    paths:
      - "contractgraph_qa/project_quickstart*.py"
      - "contractgraph_qa/*_cli.py"
      - "tools/tests/test_project_quickstart*.py"
      - "docs/QUICKSTART_HARDENING.md"
      - ".github/workflows/quickstart-hardening.yml"

permissions:
  contents: read

jobs:
  quickstart-hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Targeted hardening regressions
        run: python -m unittest tools.tests.test_project_quickstart_hardening -v
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          rm -rf quickstart-wheel
          python -m pip wheel . --no-deps --wheel-dir quickstart-wheel
          python -m pip install --force-reinstall quickstart-wheel/contractgraph_qa-*.whl
      - name: Installed-wheel nested-project smoke
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cgqa-monorepo" "$RUNNER_TEMP/cgqa-monorepo-report"
          mkdir -p "$RUNNER_TEMP/cgqa-monorepo/packages/payments/src"
          cat > "$RUNNER_TEMP/cgqa-monorepo/packages/payments/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          solc_version = "0.8.24"
          EOF
          cat > "$RUNNER_TEMP/cgqa-monorepo/packages/payments/src/Vault.sol" <<'EOF'
          pragma solidity ^0.8.24;
          contract Vault {
              function deadline() external view returns (uint256) {
                  return block.timestamp;
              }
          }
          EOF
          cd "$RUNNER_TEMP"
          cgqa quickstart \
            --target "$RUNNER_TEMP/cgqa-monorepo" \
            --output-dir "$RUNNER_TEMP/cgqa-monorepo-report"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "cgqa-monorepo-report" / "quickstart.json"
          data = json.loads(report.read_text(encoding="utf-8"))
          assert data["schema"] == "cgqa/project-quickstart/v0.2"
          assert data["primary"]["framework"] == "foundry"
          assert data["primary"]["projectRoot"] == "packages/payments"
          assert data["subject"]["configurationFingerprint"]
          assert data["postNativeSubject"]["changed"] is False
          assert data["securityVerdictAuthorized"] is False
          PY
      - name: Public parser exit contract
        shell: bash
        run: |
          set +e
          cgqa witness > "$RUNNER_TEMP/witness.out" 2> "$RUNNER_TEMP/witness.err"
          code=$?
          set -e
          test "$code" -eq 10
