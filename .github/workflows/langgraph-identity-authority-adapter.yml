name: LangGraph identity authority adapter

on:
  pull_request:
    paths:
      - "proofs/langgraph-identity-authority-adapter-v0.1/**"
      - ".github/workflows/langgraph-identity-authority-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned LangGraph runtime
        run: |
          python -m pip install \
            "langgraph==1.2.11" \
            "langgraph-checkpoint==4.2.0" \
            "langgraph-checkpoint-sqlite==3.1.1"
      - name: Run LangGraph recovery A/B proof
        run: |
          python proofs/langgraph-identity-authority-adapter-v0.1/run_experiment.py \
            --k 5 \
            --write-report /tmp/langgraph-identity-authority-report.json
          cat /tmp/langgraph-identity-authority-report.json
      - name: Compare committed report when present
        run: |
          if [ -f proofs/langgraph-identity-authority-adapter-v0.1/report.json ]; then
            diff -u \
              proofs/langgraph-identity-authority-adapter-v0.1/report.json \
              /tmp/langgraph-identity-authority-report.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: langgraph-identity-authority-report
          path: /tmp/langgraph-identity-authority-report.json
