name: Finding report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reporting:
    name: Finding report renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Verify golden report
        run: >-
          python tools/render_finding.py
          reports/examples/CGQA-001.finding.json
          --check reports/examples/CGQA-001.md
