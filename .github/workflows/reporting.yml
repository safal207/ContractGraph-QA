name: Finding report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reporting:
    name: Finding report renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Compute adapter manifest fingerprint
        run: echo "CGQA_MANIFEST_SHA256=$(python tools/manifest_fingerprint.py manifests/examples/adapter-fixture.json)" >> "$GITHUB_ENV"
      - name: Capture explorer result directly from Foundry
        run: FOUNDRY_PROFILE=capture forge test --match-test test_CaptureExplorerResult -vvv
      - name: Verify Foundry capture byte-for-byte
        run: cmp results/generated/CGQA-005.result.json results/examples/CGQA-005.result.json
      - name: Verify payout golden report
        run: >-
          python tools/render_finding.py
          reports/examples/CGQA-001.finding.json
          --check reports/examples/CGQA-001.md
      - name: Verify parameter golden report
        run: >-
          python tools/render_finding.py
          reports/examples/CGQA-002.finding.json
          --check reports/examples/CGQA-002.md
      - name: Verify temporal golden report
        run: >-
          python tools/render_finding.py
          reports/examples/CGQA-003.finding.json
          --check reports/examples/CGQA-003.md
      - name: Verify fork adapter golden report
        run: >-
          python tools/render_finding.py
          reports/examples/CGQA-004.finding.json
          --check reports/examples/CGQA-004.md
      - name: Verify manifest-to-finding export
        run: >-
          python tools/export_finding.py
          manifests/examples/adapter-fixture.json
          results/generated/CGQA-005.result.json
          --check reports/examples/CGQA-005.finding.json
      - name: Verify manifest-export golden report
        run: >-
          python tools/render_finding.py
          reports/examples/CGQA-005.finding.json
          --check reports/examples/CGQA-005.md
