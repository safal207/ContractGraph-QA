name: Distribution

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: build verified distribution artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check version contract
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python tools/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_version.py
          fi
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir .distribution-wheel
      - name: Install built wheel
        run: python -m pip install .distribution-wheel/contractgraph_qa-*.whl
      - name: Run installed-wheel self-serve demo outside checkout
        shell: bash
        run: |
          rm -rf /tmp/cgqa-distribution-demo
          cd /tmp
          cgqa demo --output-dir /tmp/cgqa-distribution-demo
          cgqa verify-bundle /tmp/cgqa-distribution-demo/CGQA-005.evidence.zip
      - name: Assemble distribution directory
        shell: bash
        run: |
          rm -rf distribution
          mkdir distribution
          cp .distribution-wheel/contractgraph_qa-*.whl distribution/
          cp /tmp/cgqa-distribution-demo/CGQA-005.md distribution/DEMO_REPORT.md
          cp /tmp/cgqa-distribution-demo/CGQA-005.evidence.zip distribution/DEMO_EVIDENCE.zip
          cp docs/client-proof/README.md distribution/CLIENT_PROOF.md
          (cd distribution && sha256sum contractgraph_qa-*.whl DEMO_REPORT.md DEMO_EVIDENCE.zip CLIENT_PROOF.md > SHA256SUMS)
      - name: Upload verified distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contractgraph-qa-${{ github.ref_name }}
          path: distribution/
          if-no-files-found: error
          retention-days: 30
