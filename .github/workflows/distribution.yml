name: Distribution

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  distribution:
    name: build verified distribution artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check version contract
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python tools/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_version.py
          fi
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir .distribution-wheel
      - name: Install built wheel
        run: python -m pip install --no-deps .distribution-wheel/contractgraph_qa-*.whl
      - name: Run installed-wheel self-serve demo outside checkout
        shell: bash
        run: |
          rm -rf /tmp/cgqa-distribution-demo
          cd /tmp
          cgqa demo --output-dir /tmp/cgqa-distribution-demo
          cgqa verify-bundle /tmp/cgqa-distribution-demo/CGQA-005.evidence.zip
      - name: Assemble and verify distribution directory
        shell: bash
        run: |
          rm -rf distribution
          mkdir distribution
          cp .distribution-wheel/contractgraph_qa-*.whl distribution/
          cp /tmp/cgqa-distribution-demo/CGQA-005.md distribution/DEMO_REPORT.md
          cp /tmp/cgqa-distribution-demo/CGQA-005.evidence.zip distribution/DEMO_EVIDENCE.zip
          cp docs/client-proof/README.md distribution/CLIENT_PROOF.md
          cp docs/GITHUB_RELEASE.md distribution/VERIFY.md
          WHEEL_PATH="$(find distribution -maxdepth 1 -type f -name 'contractgraph_qa-*.whl' -print -quit)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          python tools/build_release_sbom.py \
            --wheel "${WHEEL_PATH}" \
            --output distribution/SBOM.cdx.json \
            --source-commit "${GITHUB_SHA}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python tools/verify_release_sbom.py \
            --wheel "${WHEEL_PATH}" \
            --sbom distribution/SBOM.cdx.json \
            --source-commit "${GITHUB_SHA}"
          (cd distribution && sha256sum contractgraph_qa-*.whl DEMO_REPORT.md DEMO_EVIDENCE.zip CLIENT_PROOF.md SBOM.cdx.json VERIFY.md > SHA256SUMS)
          (cd distribution && sha256sum -c SHA256SUMS)
      - name: Attest signed checksum manifest
        id: checksum-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: distribution/SHA256SUMS
      - name: Attest wheel SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: distribution/contractgraph_qa-*.whl
          sbom-path: distribution/SBOM.cdx.json
      - name: Preserve Sigstore attestation bundles
        shell: bash
        run: |
          cp "${{ steps.checksum-attestation.outputs.bundle-path }}" distribution/SHA256SUMS.attestation.json
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" distribution/SBOM.attestation.json
      - name: Upload verified distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contractgraph-qa-${{ github.ref_name }}
          path: distribution/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable tag release assets
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${GITHUB_REF_NAME}; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" distribution/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "ContractGraph-QA ${GITHUB_REF_NAME}" \
            --notes-file docs/GITHUB_RELEASE.md
