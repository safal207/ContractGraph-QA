name: FCRP v0.2 Contract Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - contractgraph_qa/fcrp_v02.py
      - benchmarks/fcrp-v0.2/**
      - tools/tests/test_fcrp_v02.py
      - docs/FRACTAL_CAUSAL_REFACTORING_PROTOCOL_V0_2.md
      - .github/workflows/fcrp-v0-2.yml

permissions:
  contents: read

concurrency:
  group: fcrp-v0-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXACT_HEAD }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"

      - name: Compile v0.1 and v0.2 cores
        run: |
          python -m py_compile \
            contractgraph_qa/fcrp.py \
            contractgraph_qa/fcrp_v02.py \
            tools/tests/test_fcrp_v02.py

      - name: Run dependency-free FCRP v0.2 contract tests
        run: python -m unittest discover -s tools/tests -p 'test_fcrp_v02.py' -v

      - name: Evaluate portability case directly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from contractgraph_qa.fcrp_v02 import evaluate_fcrp_v02_case

          path = Path('benchmarks/fcrp-v0.2/FCRP-V02-PORT-001-liminalosai-authority.json')
          case = json.loads(path.read_text(encoding='utf-8'))
          result = evaluate_fcrp_v02_case(case)
          assert result['decision'] == 'PASS'
          assert result['mutationAuthorized'] is False
          assert result['causalPropagationStopped'] is True
          assert result['decision'] == case['expectedProtocolDecision']
          print(json.dumps(result, sort_keys=True))
          PY
