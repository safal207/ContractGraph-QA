name: LangGraph ordering barrier red-first

on:
  push:
    branches: [main]
    paths:
      - "tools/langgraph_ordering_barrier_probe.py"
      - "tests/test_langgraph_ordering_barrier_probe.py"
      - "benchmarks/langgraph-ordering-barrier-red-first-v0.1/**"
      - ".github/workflows/langgraph-ordering-barrier-red-first.yml"
  pull_request:
    paths:
      - "tools/langgraph_ordering_barrier_probe.py"
      - "tests/test_langgraph_ordering_barrier_probe.py"
      - "benchmarks/langgraph-ordering-barrier-red-first-v0.1/**"
      - ".github/workflows/langgraph-ordering-barrier-red-first.yml"

permissions:
  contents: read

jobs:
  mechanism:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream-main-red
            repository: langchain-ai/langgraph
            ref: aa742fb31e2827d569b843e3600aeda2e0528e4b
            expect: red
            sync_failure: red
            async_failure: red
          - label: pr-8055-head-green
            repository: i-anubhav-anand/langgraph
            ref: 1c2cf39b406f9207ab96b8ffca5e96abf75a4920
            expect: green
            sync_failure: red
            async_failure: green
          - label: sync-failure-followup-green
            repository: mstevens843/langgraph
            ref: fc0e1c9ffdf92bc5bfd17811b3543fefd475d267
            expect: green
            sync_failure: green
            async_failure: green

    steps:
      - name: Checkout ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout pinned LangGraph subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: subject-langgraph
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install probe and pinned subject
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check ./subject-langgraph/libs/langgraph

      - name: Verify installed loop matches the exact source pin
        env:
          SUBJECT_REF: ${{ matrix.ref }}
        run: |
          test "$(git -C subject-langgraph rev-parse HEAD)" = "$SUBJECT_REF"
          python - <<'PY'
          from pathlib import Path
          from langgraph.pregel import _loop
          expected = Path("subject-langgraph/libs/langgraph/langgraph/pregel/_loop.py").read_bytes()
          assert Path(_loop.__file__).read_bytes() == expected, "installed loop differs from pinned source"
          PY

      - name: Test the detector independently of barrier names
        shell: bash
        run: |
          mkdir -p artifacts/langgraph-ordering-barrier
          python -m unittest discover -s tests -p test_langgraph_ordering_barrier_probe.py -v \
            2>&1 | tee artifacts/langgraph-ordering-barrier/detector-self-tests.txt

      - name: Run no-sleep RED→GREEN mechanism probe
        env:
          CGQA_SUBJECT_REPOSITORY: ${{ matrix.repository }}
          CGQA_SUBJECT_REF: ${{ matrix.ref }}
        run: |
          python -m tools.langgraph_ordering_barrier_probe \
            --expect "${{ matrix.expect }}" \
            --expect-sync-failure-propagation "${{ matrix.sync_failure }}" \
            --expect-async-failure-propagation "${{ matrix.async_failure }}" \
            --json "artifacts/langgraph-ordering-barrier/${{ matrix.label }}.json"

      - name: Publish job summary
        if: always()
        env:
          RESULT: artifacts/langgraph-ordering-barrier/${{ matrix.label }}.json
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT"])
          if not path.exists():
              print("No probe result produced; inspect the preceding failed step.")
              raise SystemExit(0)
          result = json.loads(path.read_text())
          print("## LangGraph #8039: ordering != failure propagation")
          print()
          print(f"Ordering verdict: **{result['verdict']}**")
          if "harness_error" in result:
              print(f"Harness ERROR (not expected RED): `{result['harness_error']}`")
          else:
              print(f"Subject: `{result['subject']['repository']}@{result['subject']['ref']}`")
              print(f"Failure-propagation verdict: **{result['failure_propagation']['verdict']}**")
              print()
              print("| Axis | Check | Result |")
              print("|---|---|---|")
              for axis, checks in (("ordering", result["checks"]),
                                   ("failure propagation", result["failure_propagation"]["checks"])):
                  for name, ok in checks.items():
                      print(f"| {axis} | {name} | {'GREEN' if ok else 'RED'} |")
              print()
              print(f"Diagnostics only (not verdict inputs): `{result['diagnostics']}`")
              print(f"Expectation mismatches: `{result['expectation_mismatches']}`")
          print()
          print(result["claim_boundary"])
          PY

      - name: Upload machine-readable result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langgraph-ordering-barrier-${{ matrix.label }}
          path: artifacts/langgraph-ordering-barrier
          if-no-files-found: error
          retention-days: 30
