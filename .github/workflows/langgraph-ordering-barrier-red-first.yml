name: LangGraph ordering barrier red-first

on:
  push:
    branches: [main]
    paths:
      - "tools/langgraph_ordering_barrier_probe.py"
      - "benchmarks/langgraph-ordering-barrier-red-first-v0.1/**"
      - ".github/workflows/langgraph-ordering-barrier-red-first.yml"
  pull_request:
    paths:
      - "tools/langgraph_ordering_barrier_probe.py"
      - "benchmarks/langgraph-ordering-barrier-red-first-v0.1/**"
      - ".github/workflows/langgraph-ordering-barrier-red-first.yml"

permissions:
  contents: read

jobs:
  mechanism:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream-main-red
            repository: langchain-ai/langgraph
            ref: aa742fb31e2827d569b843e3600aeda2e0528e4b
            expect: red
          - label: pr-8055-head-green
            repository: i-anubhav-anand/langgraph
            ref: 1c2cf39b406f9207ab96b8ffca5e96abf75a4920
            expect: green

    steps:
      - name: Checkout ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout pinned LangGraph subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: subject-langgraph
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install probe and pinned subject
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check ./subject-langgraph/libs/langgraph

      - name: Run no-sleep RED→GREEN mechanism probe
        env:
          CGQA_SUBJECT_REPOSITORY: ${{ matrix.repository }}
          CGQA_SUBJECT_REF: ${{ matrix.ref }}
        run: |
          mkdir -p artifacts/langgraph-ordering-barrier
          python -m tools.langgraph_ordering_barrier_probe \
            --expect "${{ matrix.expect }}" \
            --json "artifacts/langgraph-ordering-barrier/${{ matrix.label }}.json"

      - name: Publish job summary
        env:
          RESULT: artifacts/langgraph-ordering-barrier/${{ matrix.label }}.json
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT"]).read_text())
          print("## LangGraph #8039 ordering barrier")
          print()
          print(f"- Subject: `{result['subject']['repository']}@{result['subject']['ref']}`")
          print(f"- Verdict: **{result['verdict']}**")
          print(f"- LangGraph package version: `{result['subject']['langgraph_version']}`")
          print()
          print("| Check | Result |")
          print("|---|---|")
          for name, ok in result["checks"].items():
              print(f"| {name} | {'PASS' if ok else 'FAIL'} |")
          print()
          print(f"Registered barrier(s): `{result['evidence']['registered_barriers']}`")
          print()
          print(result["claim_boundary"])
          PY

      - name: Upload machine-readable result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langgraph-ordering-barrier-${{ matrix.label }}
          path: artifacts/langgraph-ordering-barrier
          if-no-files-found: error
          retention-days: 30
