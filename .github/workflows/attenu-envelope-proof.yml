name: Attenu observer-envelope proof

on:
  pull_request:
    paths:
      - '.github/workflows/attenu-envelope-proof.yml'
      - 'proofs/attenu-envelope-v1.1-independent/**'
      - 'proofs/attenu-guard-v0.12.1-independent/independent_bundle_verifier.py'
      - 'tools/tests/test_attenu_envelope_v11_proof.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/attenu-envelope-proof.yml'
      - 'proofs/attenu-envelope-v1.1-independent/**'
      - 'proofs/attenu-guard-v0.12.1-independent/independent_bundle_verifier.py'
      - 'tools/tests/test_attenu_envelope_v11_proof.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-envelope-score:
    name: Repository, PyPI, and npm — 18-case score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out exact upstream subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: attenu-io/attenu-guard
          ref: f34a351c12ddc08e9c8bd3beca9da4695a46376f
          path: external/attenu-guard
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install the independent cryptographic backend
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'

      - name: Run static proof-contract tests
        run: python -m unittest tools/tests/test_attenu_envelope_v11_proof.py -v

      - name: Download exact registry artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/attenu-envelope-artifacts"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/attenu-envelope-artifacts" 'attenu-guard==0.13.0'
          npm pack 'attenu-guard@0.8.0' \
            --pack-destination "$RUNNER_TEMP/attenu-envelope-artifacts" --silent

      - name: Extract the three vector copies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from tarfile import open as tar_open
          from zipfile import ZipFile
          import os

          pin = '6a57d75ebec881d39d5a1805793a20f9a6d7bff021b70782dcb57c43b276df64'
          root = Path(os.environ['RUNNER_TEMP']) / 'attenu-envelope-artifacts'
          wheel = next(root.glob('attenu_guard-0.13.0-*.whl'))
          tarball = next(root.glob('attenu-guard-0.8.0.tgz'))

          def choose(label, rows):
              matches = [(name, raw) for name, raw in rows if sha256(raw).hexdigest() == pin]
              if not matches:
                  observed = [(name, sha256(raw).hexdigest()) for name, raw in rows]
                  raise SystemExit(f'{label}: no vector copy matched the pin; observed={observed}')
              return matches[0][1]

          with ZipFile(wheel) as archive:
              rows = [
                  (name, archive.read(name))
                  for name in archive.namelist()
                  if name.endswith('/vectors/envelopes/envelope_vectors_v1.json')
              ]
              (root / 'python-envelope.json').write_bytes(choose('wheel', rows))

          with tar_open(tarball, 'r:gz') as archive:
              rows = []
              for member in archive.getmembers():
                  if not member.isfile() or not member.name.endswith(
                      '/vectors/envelopes/envelope_vectors_v1.json'
                  ):
                      continue
                  extracted = archive.extractfile(member)
                  if extracted is not None:
                      rows.append((member.name, extracted.read()))
              (root / 'npm-envelope.json').write_bytes(choose('npm', rows))
          PY

      - name: Independently score the frozen envelope corpus
        shell: bash
        run: |
          set -euo pipefail
          python proofs/attenu-envelope-v1.1-independent/verify_envelope_vectors.py \
            --vectors external/attenu-guard/tests/vectors/envelopes/envelope_vectors_v1.json \
            --python-vector "$RUNNER_TEMP/attenu-envelope-artifacts/python-envelope.json" \
            --npm-vector "$RUNNER_TEMP/attenu-envelope-artifacts/npm-envelope.json" \
            --json-out "$RUNNER_TEMP/attenu-envelope-report.json"

      - name: Require deterministic report regeneration
        run: >-
          diff -u
          proofs/attenu-envelope-v1.1-independent/report.json
          "$RUNNER_TEMP/attenu-envelope-report.json"
