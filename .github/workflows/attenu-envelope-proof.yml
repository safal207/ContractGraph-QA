name: Independent Attenu Envelope V1.1 Proof

on:
  pull_request:
    paths:
      - '.github/workflows/attenu-envelope-proof.yml'
      - 'proofs/attenu-guard-v0.13.0-envelope-independent/**'
      - 'proofs/attenu-guard-v0.12.1-independent/independent_bundle_verifier.py'
      - 'tools/tests/test_attenu_envelope_v11_proof.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/attenu-envelope-proof.yml'
      - 'proofs/attenu-guard-v0.13.0-envelope-independent/**'
      - 'proofs/attenu-guard-v0.12.1-independent/independent_bundle_verifier.py'
      - 'tools/tests/test_attenu_envelope_v11_proof.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envelope-v11:
    name: Frozen corpus and independent envelope scorer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ContractGraph-QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out pinned Attenu release data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: attenu-io/attenu-guard
          ref: 8042a0ce33a9f8a7bf54a1917d5e8a0ac0344084
          path: external/attenu-guard
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'

      - name: Install the one envelope-verification dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'

      - name: Run local negative controls
        run: python -m unittest tools/tests/test_attenu_envelope_v11_proof.py -v

      - name: Score the exact released envelope corpus
        run: >-
          python
          proofs/attenu-guard-v0.13.0-envelope-independent/independent_envelope_verifier.py
          external/attenu-guard/tests/vectors/envelopes/envelope_vectors_v1.json
          --json-out "$RUNNER_TEMP/attenu-envelope-v11-report.json"
          --markdown-out "$RUNNER_TEMP/attenu-envelope-v11-report.md"

      - name: Require deterministic committed evidence
        run: |
          diff -u \
            proofs/attenu-guard-v0.13.0-envelope-independent/report.json \
            "$RUNNER_TEMP/attenu-envelope-v11-report.json"
          diff -u \
            proofs/attenu-guard-v0.13.0-envelope-independent/README.md \
            "$RUNNER_TEMP/attenu-envelope-v11-report.md"

      - name: Show exact output digests
        run: |
          sha256sum \
            "$RUNNER_TEMP/attenu-envelope-v11-report.json" \
            "$RUNNER_TEMP/attenu-envelope-v11-report.md"

      - name: Upload review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attenu-envelope-v11-independent-report
          path: |
            ${{ runner.temp }}/attenu-envelope-v11-report.json
            ${{ runner.temp }}/attenu-envelope-v11-report.md
          if-no-files-found: error
          retention-days: 14
