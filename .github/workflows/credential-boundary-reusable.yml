name: Credential Boundary Reusable

on:
  workflow_call:
    inputs:
      python-version:
        description: Python runtime used by the scanner
        required: false
        type: string
        default: "3.11"
      scanner-ref:
        description: Immutable ContractGraph-QA commit containing the canonical scanner
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495c4e3e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Checkout canonical scanner at explicit immutable revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: safal207/ContractGraph-QA
          ref: ${{ inputs.scanner-ref }}
          path: .fcrp-contractgraph-qa
          sparse-checkout: tools/credential_boundary.py
          persist-credentials: false

      - name: Scan tracked repository boundary
        run: |
          python .fcrp-contractgraph-qa/tools/credential_boundary.py \
            --root "$GITHUB_WORKSPACE" \
            --format text
