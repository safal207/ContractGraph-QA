name: Credential Boundary Reusable

on:
  workflow_call:
    inputs:
      python-version:
        description: Python runtime used by the scanner
        required: false
        type: string
        default: "3.11"
      scanner-ref:
        description: Immutable ContractGraph-QA commit containing the canonical scanner
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Checkout canonical scanner at explicit immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: safal207/ContractGraph-QA
          ref: ${{ inputs.scanner-ref }}
          path: .fcrp-contractgraph-qa
          sparse-checkout: tools/credential_boundary.py
          persist-credentials: false

      - name: Scan tracked repository boundary
        run: |
          python .fcrp-contractgraph-qa/tools/credential_boundary.py \
            --root "$GITHUB_WORKSPACE" \
            --format text
