name: FCRP P1-3 — Evidence, Authority and Reflection Boundary

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - schemas/authority-reflection-boundary.v0.1.schema.json
      - fixtures/p1-3/**
      - tools/authority_reflection_boundary.py
      - tools/tests/test_authority_reflection_boundary.py
      - docs/NEO_REZONANS_P1_3_AUTHORITY_REFLECTION_BOUNDARY_V0_1.md
      - .github/workflows/fcrp-p1-3-authority-reflection-boundary.yml

permissions:
  contents: read

concurrency:
  group: fcrp-p1-3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      EXPECTED_PR_BASE: b54173530c675083426137176cde0aed0b90853a
      EXPECTED_PROOFPATH_HEAD: 4a05ee31d7497979c2505dd55bfef08823302e24

    steps:
      - name: Checkout exact P1-3 verifier subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify exact verifier subject and PR base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PR_BASE" "$EXACT_HEAD"
          if [ -n "$PR_BASE_SHA" ]; then test "$PR_BASE_SHA" = "$EXPECTED_PR_BASE"; fi

      - name: Validate schema and fixture syntax
        shell: bash
        run: |
          set -euo pipefail
          jq empty schemas/authority-reflection-boundary.v0.1.schema.json
          jq empty fixtures/p1-3/authority-reflection-boundary.v0.1.json
          for file in fixtures/p1-3/bundle/*.json; do jq empty "$file"; done

      - name: Run focused P1-3 tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m py_compile \
            tools/authority_reflection_boundary.py \
            tools/tests/test_authority_reflection_boundary.py
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest \
            tools.tests.test_authority_reflection_boundary -v

      - name: Verify boundary and independently replay it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/p1-3/bundle
          cp fixtures/p1-3/authority-reflection-boundary.v0.1.json evidence/p1-3/manifest.json
          cp fixtures/p1-3/bundle/*.json evidence/p1-3/bundle/
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/authority_reflection_boundary.py verify \
            --manifest evidence/p1-3/manifest.json \
            --root evidence/p1-3/bundle \
            --checked-subject "$EXACT_HEAD" \
            --expected-proofpath-subject "$EXPECTED_PROOFPATH_HEAD" \
            --output evidence/p1-3/result.json
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/authority_reflection_boundary.py verify \
            --manifest evidence/p1-3/manifest.json \
            --root evidence/p1-3/bundle \
            --checked-subject "$EXACT_HEAD" \
            --expected-proofpath-subject "$EXPECTED_PROOFPATH_HEAD" \
            --output /tmp/p1-3-replay-result.json
          cmp evidence/p1-3/result.json /tmp/p1-3-replay-result.json
          jq -e '
            .decision == "PASS" and
            .subject_count == 5 and
            .artifact_count == 3 and
            .case_count == 4 and
            .blocked_cases == 3 and
            .hold_cases == 1 and
            .executed_cases == 0 and
            .evidence_cannot_authorize == true and
            .reflection_cannot_authorize == true and
            .explicit_authority_required == true and
            .replay_stable == true and
            .side_effects_executed == false and
            (.authority.execution_authorized == false) and
            (.authority.external_effects_authorized == false) and
            (.authority.mutation_authorized == false)
          ' evidence/p1-3/result.json >/dev/null

      - name: Capture exact run context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/p1-3
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("evidence/p1-3/run-context.json").write_text(json.dumps({
              "schema": "cgqa.p1-3-run-context.v0.1",
              "checked_subject": os.environ["EXACT_HEAD"],
              "expected_subject": os.environ["EXACT_HEAD"],
              "expected_proofpath_subject": os.environ["EXPECTED_PROOFPATH_HEAD"],
              "reported_sha": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "authority": "advisory only; evidence/reflection cannot authorize execution; no executor or external effect",
          }, indent=2, sort_keys=True) + "\n")
          PY

      - name: Build immutable P1-3 SHA-256 manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd evidence/p1-3
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload P1-3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fcrp-p1-3-authority-reflection-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/p1-3/
          if-no-files-found: error
          retention-days: 90
