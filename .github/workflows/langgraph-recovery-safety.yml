name: LangGraph recovery safety

on:
  push:
    branches: [main]
    paths:
      - "contractgraph_qa/integrations/langgraph_recovery_safety.py"
      - "tools/langgraph_recovery_safety_probe.py"
      - "tools/langgraph_recovery_safety_report.py"
      - "tools/tests/test_langgraph_recovery_safety.py"
      - "benchmarks/langgraph-recovery-safety-v0.1/**"
      - "benchmarks/README.md"
      - "docs/LANGGRAPH_RECOVERY_SAFETY.md"
      - ".github/workflows/langgraph-recovery-safety.yml"
  pull_request:
    paths:
      - "contractgraph_qa/integrations/langgraph_recovery_safety.py"
      - "tools/langgraph_recovery_safety_probe.py"
      - "tools/langgraph_recovery_safety_report.py"
      - "tools/tests/test_langgraph_recovery_safety.py"
      - "benchmarks/langgraph-recovery-safety-v0.1/**"
      - "benchmarks/README.md"
      - "docs/LANGGRAPH_RECOVERY_SAFETY.md"
      - ".github/workflows/langgraph-recovery-safety.yml"

permissions:
  contents: read

jobs:
  recovery-safety:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-1.2.4
            langgraph: "1.2.4"
            sqlite: "3.1.0"
            assert_baseline: true
          - label: publication-comparison-1.2.11
            langgraph: "1.2.11"
            sqlite: "3.1.1"
            assert_baseline: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned runtime profile
        run: |
          python -m pip install --disable-pip-version-check -e . \
            "langgraph==${{ matrix.langgraph }}" \
            "langgraph-checkpoint-sqlite==${{ matrix.sqlite }}"

      - name: Compile and run deterministic evaluator tests
        run: |
          python -m compileall -q contractgraph_qa tools
          python -m unittest tools.tests.test_langgraph_recovery_safety -v

      - name: Reproduce committed baseline report
        if: matrix.assert_baseline
        run: |
          python -m tools.langgraph_recovery_safety_report \
            benchmarks/langgraph-recovery-safety-v0.1/observations.json \
            --output /tmp/langgraph-rs-result.json \
            >/tmp/langgraph-rs-result.stdout
          diff -u \
            benchmarks/langgraph-recovery-safety-v0.1/result.json \
            /tmp/langgraph-rs-result.json

      - name: Run live SIGKILL observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/langgraph-rs

          if [[ "${{ matrix.assert_baseline }}" == "true" ]]; then
            baseline_duplicate=(--expect duplicate)
            baseline_once=(--expect exactly-once)
            baseline_dedup=(--expect deduped-reexecution)
          else
            baseline_duplicate=()
            baseline_once=()
            baseline_dedup=()
          fi

          python -m tools.langgraph_recovery_safety_probe \
            writes-delay --receiver append "${baseline_duplicate[@]}" \
            --json artifacts/langgraph-rs/writes-delay-append.json

          python -m tools.langgraph_recovery_safety_probe \
            put-delay --receiver append "${baseline_once[@]}" \
            --json artifacts/langgraph-rs/put-delay-append.json

          python -m tools.langgraph_recovery_safety_probe \
            writes-delay --receiver dedup "${baseline_dedup[@]}" \
            --json artifacts/langgraph-rs/writes-delay-dedup.json

          python -m tools.langgraph_recovery_safety_report \
            artifacts/langgraph-rs/writes-delay-append.json \
            artifacts/langgraph-rs/put-delay-append.json \
            artifacts/langgraph-rs/writes-delay-dedup.json \
            --output artifacts/langgraph-rs/report.json

      - name: Publish job summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/langgraph-rs/report.json").read_text())
          print("## LangGraph recovery-safety result")
          print()
          print(f"- Conformant: `{report['conformant']}`")
          print(f"- LangGraph: `{report['subject']['langgraph_version']}`")
          print(
              "- SQLite checkpointer: "
              f"`{report['subject']['sqlite_checkpointer_version']}`"
          )
          print()
          print("| Property | Status |")
          print("|---|---|")
          for check in report["checks"]:
              print(f"| {check['property']} — {check['name']} | {check['status']} |")
          control = report.get("receiver_control")
          if control:
              print(f"| {control['property']} — {control['name']} | {control['status']} |")
          PY

      - name: Upload machine-readable observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langgraph-recovery-safety-${{ matrix.label }}
          path: artifacts/langgraph-rs
          if-no-files-found: error
          retention-days: 30
